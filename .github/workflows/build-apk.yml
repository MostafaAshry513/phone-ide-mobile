name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android ${{ inputs.build-type || 'debug' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - run: npm ci

      # Debug: local Gradle (no JS bundled — needs Metro at runtime)
      - name: Build debug APK
        if: ${{ inputs.build-type == 'debug' || github.event_name == 'push' }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      # Release: EAS Cloud (handles Expo SDK 57 JS bundling correctly)
      - uses: expo/expo-github-action@v8
        if: ${{ inputs.build-type == 'release' }}
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }

      - name: EAS release build
        if: ${{ inputs.build-type == 'release' }}
        run: |
          eas build --platform android --profile production --non-interactive --wait
          mkdir -p artifacts
          find . -name "*.apk" -o -name "*.aab" | head -5 | xargs -I{} cp {} artifacts/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-ide-android-${{ inputs.build-type || 'debug' }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            artifacts/*.apk
            artifacts/*.aab
          retention-days: 30
