name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ${{ inputs.build-type || 'debug' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - run: npm ci

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install

      # Debug: local Gradle (fast, but APK needs Metro at runtime)
      - name: Build debug
        if: ${{ inputs.build-type == 'debug' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      # Release: EAS Cloud (standalone APK, no Metro needed)
      - uses: expo/expo-github-action@v8
        if: ${{ inputs.build-type == 'release' }}
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }

      - name: Submit to EAS
        if: ${{ inputs.build-type == 'release' }}
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Upload debug APK
        if: ${{ inputs.build-type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-ide-android-debug
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
